services:
  - type: web
    name: amazon-associate
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DJANGO_SETTINGS_MODULE
        value: config.Settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: amazon-associate-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: amazon-associate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: amazon-associate-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: amazon-associate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: amazon-associate-db
          property: port

databases:
  - name: amazon-associate-db
    plan: free
    region: oregon
