<div class="col">
    <div class="card h-100 product-card">
        <a href="{{ product.get_redirect_url }}" class="product-card__img-link">
            {% if product.image_url %}
            <img src="{{ product.image_url }}"
                 alt="{{ product.name }}"
                 class="card-img-top product-card__img">
            {% else %}
            <div class="product-card__placeholder">
                <i class="bi bi-image text-secondary" style="font-size:3rem;"></i>
            </div>
            {% endif %}
        </a>
        <div class="card-body d-flex flex-column">
            <h5 class="card-title product-card__title">
                <a href="{{ product.get_redirect_url }}" class="text-decoration-none text-dark">
                    {{ product.name }}
                </a>
            </h5>
            {% if product.description %}
            <p class="card-text product-card__desc text-muted small">{{ product.description }}</p>
            {% endif %}
            <div class="mt-auto pt-2">
                <a href="{{ product.get_redirect_url }}"
                   class="btn btn-warning btn-sm w-100 fw-semibold">
                    View on Amazon
                </a>
            </div>
        </div>
    </div>
</div>
